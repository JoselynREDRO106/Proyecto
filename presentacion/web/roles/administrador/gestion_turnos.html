<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de turnos - Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-accent">
  <div class="app-shell">
    <div data-navbar></div>
    <main class="container py-4">
      <div class="page-header">
        <h1>Gestion de turnos</h1>
        <p class="text-muted">Cola FIFO y rotacion de ventanillas por lista circular.</p>
      </div>
      <div class="row g-3">
        <div class="col-lg-8">
          <section class="content-panel">
            <h2 class="h5">Cola completa</h2>
            <div data-cola></div>
          </section>
        </div>
        <div class="col-lg-4">
          <section class="content-panel">
            <h2 class="h5">Lista circular</h2>
            <div data-ventanillas-estado></div>
            <button class="btn btn-primary w-100 mt-3" type="button" data-rotar-ventanilla>Rotar ventanilla</button>
          </section>
          <section class="content-panel mt-3">
            <h2 class="h5">Registrar ventanilla</h2>
            <form data-crear-ventanilla>
              <label class="form-label" for="nombre">Nombre</label>
              <input class="form-control mb-2" id="nombre" name="nombre" placeholder="Ventanilla 1" required>
              <label class="form-label" for="ubicacion">Ubicacion</label>
              <input class="form-control mb-3" id="ubicacion" name="ubicacion" placeholder="Bloque Administrativo">
              <button class="btn btn-outline-primary w-100">Crear ventanilla activa</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <div data-footer></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script type="module" src="../../assets/js/api.js"></script>
  <script type="module" src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/componentes/navbar.js"></script>
  <script src="../../assets/js/componentes/footer.js"></script>
  <script src="../../assets/js/estructuras/cola.js"></script>
  <script>
    const renderCola = async () => {
      const cola = document.querySelector("[data-cola]");
      cola.innerHTML = SmartCampusUtils.loading("Cargando cola FIFO...");
      try {
        const turnos = await SmartCampusAPI.parseJson(await SmartCampusAPI.obtenerTurnosUsuario());
        SmartCampusCola.render(cola, Array.isArray(turnos) ? turnos : []);
      } catch (error) {
        SmartCampusUtils.showAlert(cola, error.message, "danger");
      }
    };

    const renderVentanillas = async () => {
      const target = document.querySelector("[data-ventanillas-estado]");
      target.innerHTML = SmartCampusUtils.loading("Cargando ventanillas...");
      try {
        const estado = await SmartCampusAPI.parseJson(await SmartCampusAPI.obtenerRotacionVentanillas());
        const ventanillas = estado.ventanillas || [];
        if (!ventanillas.length) {
          target.innerHTML = `<div class="alert alert-warning mb-0">No hay ventanillas activas registradas.</div>`;
          return;
        }
        target.innerHTML = `
          <p class="mb-1"><strong>Actual:</strong> ${estado.actual?.nombre || "-"}</p>
          <p class="mb-3"><strong>Siguiente:</strong> ${estado.siguiente?.nombre || "-"}</p>
          <div class="list-group">
            ${ventanillas.map((v) => `
              <div class="list-group-item">
                <strong>${v.nombre}</strong>
                <div class="small text-muted">${v.ubicacion || "Sin ubicacion"}</div>
              </div>
            `).join("")}
          </div>
        `;
      } catch (error) {
        SmartCampusUtils.showAlert(target, error.message, "danger");
      }
    };

    document.addEventListener("DOMContentLoaded", async () => {
      await Promise.all([renderCola(), renderVentanillas()]);
    });

    document.querySelector("[data-rotar-ventanilla]").addEventListener("click", async () => {
      try {
        await SmartCampusAPI.parseJson(await SmartCampusAPI.rotarVentanilla());
        await renderVentanillas();
      } catch (error) {
        alert(error.message);
      }
    });

    document.querySelector("[data-crear-ventanilla]").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = SmartCampusUtils.formData(event.currentTarget);
      try {
        await SmartCampusAPI.parseJson(await SmartCampusAPI.crearVentanilla(data));
        event.currentTarget.reset();
        await renderVentanillas();
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>
</html>
